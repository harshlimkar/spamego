name: scamego
description: Digital Scam Protection Platform for Senior Citizens
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Network
  http: ^1.6.0
  web_socket_channel: ^2.4.5
  
  # Permissions & Platform
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  
  # Telephony
  flutter_phone_direct_caller: ^2.1.1
  url_launcher: ^6.2.6
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  
  # Utilities
  intl: ^0.19.0
  logger: ^2.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Security
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/